<!doctype html>
<html lang="en" data-theme="atelier">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>HORIZON — Student Career Intelligence</title>
    <meta
      name="description"
      content="HORIZON: a polished, source-labelled career intelligence workspace for students."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5efe6;
        --paper: #fffaf3;
        --paper2: #eee4d7;
        --paper3: #e4d8c9;
        --ink: #1b1612;
        --muted: #65584e;
        --soft: #907f70;
        --accent: #ab4725;
        --accent2: #d7952d;
        --green: #2e5b48;
        --danger: #a64d3f;
        --line: rgba(43, 31, 22, 0.13);
        --shadow: 0 24px 70px rgba(53, 37, 24, 0.11);
        --shadow-sm: 0 10px 28px rgba(53, 37, 24, 0.08);
        --r: 26px;
        --r2: 16px;
      }
      html[data-theme="spruce"] {
        --bg: #e9f0e6;
        --paper: #fcfdf9;
        --paper2: #e0e9da;
        --paper3: #d3e0cd;
        --ink: #132219;
        --muted: #526257;
        --soft: #7d9082;
        --accent: #286148;
        --accent2: #879c32;
        --green: #24563f;
      }
      html[data-theme="riviera"] {
        --bg: #edf4f8;
        --paper: #fcfeff;
        --paper2: #e0ebf1;
        --paper3: #d3e1e9;
        --ink: #102137;
        --muted: #50677f;
        --soft: #7c90a6;
        --accent: #2e5dd4;
        --accent2: #f07345;
        --green: #187a6f;
      }
      html[data-theme="fig"] {
        --bg: #f3edf5;
        --paper: #fefbff;
        --paper2: #e9ddec;
        --paper3: #ddcde1;
        --ink: #211326;
        --muted: #604f69;
        --soft: #887594;
        --accent: #7a3195;
        --accent2: #eba320;
        --green: #20715d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
        min-height: 100vh;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ::selection {
        background: var(--accent);
        color: #fff;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        opacity: 0.65;
        background-image:
          linear-gradient(rgba(40, 30, 20, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(40, 30, 20, 0.035) 1px, transparent 1px);
        background-size: 52px 52px;
      }.app {
        min-height: 100vh;
      }
      .topline {
        height: 34px;
        border-bottom: 1px solid var(--line);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--soft);
        font: 700 9px "Space Mono";
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .shell {
        width: min(1480px, 94vw);
        margin: 0 auto;
      }
      .nav {
        position: sticky;
        top: 10px;
        z-index: 80;
        margin: 18px auto 28px;
        background: rgba(255, 250, 243, 0.82);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
        border-radius: 22px;
        padding: 9px 12px;
        box-shadow: var(--shadow-sm);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: max-content;
        padding: 3px 6px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--paper);
        border: 1px solid var(--line);
        font-family: Fraunces;
        font-weight: 800;
        font-size: 24px;
        color: var(--accent);
        box-shadow: var(--shadow-sm);
      }
      .brand h1 {
        font: 800 21px Fraunces;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .brand span {
        font: 9px "Space Mono";
        color: var(--soft);
        letter-spacing: 0.08em;
      }
      .navlinks {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        flex: 1;
        overflow: auto;
      }
      .navlinks button,
      .ghost,
      .mini {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        padding: 9px 11px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .navlinks button:hover,
      .ghost:hover,
      .mini:hover {
        background: var(--paper2);
        color: var(--ink);
      }
      .primary {
        background: var(--accent) !important;
        color: #fff !important;
        border: 0 !important;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }
      .page {
        padding-bottom: 90px;
      }
      .view {
        display: none;
        animation: fadeIn 0.35s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hero {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 36px;
        align-items: center;
        padding: 50px 0 70px;
      }
      .kicker {
        font: 700 10px "Space Mono";
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
      .hero h2 {
        font: 800 clamp(51px, 7.2vw, 91px)/0.94 Fraunces;
        letter-spacing: -0.055em;
        margin: 16px 0 23px;
      }
      .hero h2 em {
        color: var(--accent);
        font-weight: 600;
      }
      .hero p {
        color: var(--muted);
        font-size: 18px;
        max-width: 730px;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 28px 0;
      }

<!doctype html>
<html lang="en" data-theme="atelier">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>HORIZON — Student Career Intelligence</title>
    <meta
      name="description"
      content="HORIZON: a polished, source-labelled career intelligence workspace for students."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <div class="toast" id="toast"></div>
    <div class="modal" id="modal">
      <div class="modalbox" id="modalContent"></div>
    </div>
    <div class="command" id="command">
      <div class="commandbox">
        <input
          id="cmdInput"
          placeholder="Search features, careers, projects, actions…"
          autocomplete="off"
        />
        <div class="commandlist" id="cmdList"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
